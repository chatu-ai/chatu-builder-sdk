# 发布到 npm（公有，带 provenance）
# 触发：推 tag `v*`（如 v0.1.0）。要求版本号已用 `pnpm release:version <ver>` 写入各包并提交。
# 需要仓库 Secret：NPM_TOKEN —— npmjs.com 上 @chatu-ai 组织的 Granular Access Token（Read and write，
# 允许 packages @chatu-ai/*，勾选 bypass 2FA 或使用 automation token）。
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package version $PKG"; exit 1; }
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
